---
site_name: samarkand
site_url: https://samarkand.kelps.org
site_description: Documentation for Samarkand
site_author: Coding Kelps
copyright: Copyright (c) 2026 Coding Kelps.
repo_name: coding-kelps/samarkand
repo_url: https://github.com/coding-kelps/samarkand
edit_uri: blob/master/docs/
theme:
  name: material
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - header.lang
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode


    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

nav:
  - Introduction: README.md
  - License: LICENSE
